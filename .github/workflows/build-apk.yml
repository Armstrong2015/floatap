name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          set -o pipefail
          "$MANAGER" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

      - name: Test and assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew test assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: floatap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
